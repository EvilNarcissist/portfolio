name: Deploy to GitHub Pages

# Сайт собирается и публикуется при каждом push в ветку main
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Личные данные лежат не в репозитории, а в секрете SITE_CONTENT (Settings → Secrets and variables → Actions).
      # Если секрета нет, сайт соберётся с обезличенными заглушками из content.example.json.
      - name: Подставить личные данные из секрета
        env:
          SITE_CONTENT: ${{ secrets.SITE_CONTENT }}
        run: |
          if [ -n "$SITE_CONTENT" ]; then
            printf '%s' "$SITE_CONTENT" > content.json
            node -e "JSON.parse(require('fs').readFileSync('content.json','utf8'))" || { echo "Секрет SITE_CONTENT не является корректным JSON"; exit 1; }
          else
            echo "Секрет SITE_CONTENT не задан, используются заглушки"
          fi
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
